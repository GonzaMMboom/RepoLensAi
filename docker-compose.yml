services:
  db:
    image: pgvector/pgvector:pg17
    container_name: repolens-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: repolens
      POSTGRES_USER: repolens
      POSTGRES_PASSWORD: local_dev_only_change_me
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./services/db/init/01-enable-pgvector.sql:/docker-entrypoint-initdb.d/01-enable-pgvector.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U repolens -d repolens"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
